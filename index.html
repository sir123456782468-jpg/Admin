<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم | The Leader In English</title>
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Cinzel:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e5e9f2;--brand:#ef4444;--grad:linear-gradient(135deg,#ef4444,#ec4899);--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--sh:0 8px 26px -14px rgba(15,23,42,.22)}
[data-theme=dark]{--bg:#0a1020;--card:#121b30;--ink:#f1f5f9;--muted:#94a3b8;--line:#22304d;--brand:#f87171;--sh:0 8px 26px -14px rgba(0,0,0,.8)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background:var(--bg);color:var(--ink);min-height:100vh}
a{color:inherit;text-decoration:none}[hidden]{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:34px 28px;box-shadow:var(--sh);text-align:center}
.lbox svg{width:76px;height:76px}.lbox h1{font-size:22px;margin:10px 0 4px}.lbox p{color:var(--muted);font-weight:600;font-size:14px;margin-bottom:20px}
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(180deg,#0f172a,#1e1b4b);color:#cbd5e1;padding:18px 14px}
.lg{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:12px}.lg svg{width:40px;height:40px}.lg b{display:block;color:#fff;font-family:Cinzel,serif;font-size:16px}.lg small{color:#f87171;font-weight:800;font-size:11px;letter-spacing:1px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:3px;border-radius:12px;font-weight:700;font-size:14.5px;transition:.2s}.nav a:hover{background:rgba(255,255,255,.08);color:#fff}.nav a.on{background:var(--grad);color:#fff;box-shadow:0 8px 20px -10px #ef4444}
.main{flex:1;min-width:0;padding:0 24px 40px}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;background:var(--bg)}.top h1{font-size:24px;font-weight:900}.tl{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:18px;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.kpi{border-radius:18px;padding:16px;color:#fff}.kpi b{display:block;font-size:30px;font-weight:900;line-height:1.2}.kpi span{font-size:13px;font-weight:700;opacity:.95}
.k1{background:linear-gradient(135deg,#ef4444,#f97316)}.k2{background:linear-gradient(135deg,#6366f1,#8b5cf6)}.k3{background:linear-gradient(135deg,#10b981,#14b8a6)}.k4{background:linear-gradient(135deg,#ec4899,#f43f5e)}.k5{background:linear-gradient(135deg,#0ea5e9,#2563eb)}.k6{background:linear-gradient(135deg,#f59e0b,#d97706)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.bar .sp{flex:1}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{background:var(--bg);text-align:right;padding:11px 12px;font-weight:800;white-space:nowrap;color:var(--muted);font-size:12.5px}td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}tr:hover td{background:rgba(239,68,68,.04)}
.btn{display:inline-block;padding:9px 18px;border-radius:11px;border:1.5px solid var(--brand);background:none;color:var(--brand);font-weight:800;font-size:13.5px;cursor:pointer;transition:.15s;white-space:nowrap}.btn:hover{transform:translateY(-1px)}
.btn.main{background:var(--grad);border-color:transparent;color:#fff}.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:9px}.btn.bad{border-color:var(--bad);color:var(--bad)}.btn.ghost{border-color:var(--line);color:var(--ink)}.btn:disabled{opacity:.6;cursor:wait}
.bdg{display:inline-block;padding:3px 11px;border-radius:50px;font-size:12px;font-weight:800;background:var(--line);color:var(--muted)}.bdg.ok{background:rgba(22,163,74,.15);color:var(--ok)}.bdg.bad{background:rgba(220,38,38,.15);color:var(--bad)}.bdg.warn{background:rgba(217,119,6,.15);color:var(--warn)}.bdg.info{background:rgba(99,102,241,.15);color:#6366f1}
input,select,textarea{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;outline:none;font-family:inherit}input:focus,select:focus,textarea:focus{border-color:var(--brand)}textarea{min-height:84px;resize:vertical}
.bar input,.bar select{width:auto;min-width:150px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.f>span{font-size:13px;font-weight:800}.f.ck{flex-direction:row;align-items:center;gap:8px}.f.ck input{width:auto}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ov{position:fixed;inset:0;z-index:100;background:rgba(2,6,23,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto}
.mb{width:100%;max-width:640px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}.mb.wide{max-width:960px}.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.mh h3{font-size:19px;font-weight:900}.x{border:none;background:var(--bg);color:var(--ink);width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer}.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.thumb{width:54px;height:38px;border-radius:8px;object-fit:cover;background:var(--grad);display:inline-block;vertical-align:middle}
.sec{font-size:15px;font-weight:900;margin:18px 0 10px;color:var(--brand)}.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.kv div{background:var(--bg);border-radius:12px;padding:10px 12px}.kv small{display:block;color:var(--muted);font-weight:700;font-size:12px}.kv b{font-size:14px;word-break:break-all}
.q{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--card)}.q h4{font-size:15px;line-height:1.8;margin:6px 0}.op{padding:6px 10px;border-radius:9px;margin-top:5px;font-size:13.5px;border:1px solid var(--line);direction:ltr;text-align:left}.op.ok{background:rgba(22,163,74,.13);border-color:var(--ok);color:var(--ok);font-weight:800}.op.bad{background:rgba(220,38,38,.12);border-color:var(--bad);color:var(--bad);font-weight:800}
.muted{color:var(--muted);font-weight:600;font-size:13px}.empty{text-align:center;padding:36px;color:var(--muted);font-weight:700}.err{background:rgba(220,38,38,.1);border:1px solid var(--bad);color:var(--bad);padding:14px;border-radius:14px;font-weight:700;line-height:1.9}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:300;display:grid;gap:8px}.toast{background:#1e293b;color:#fff;padding:11px 22px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}.toast.bad{background:#b91c1c}
@media(max-width:900px){.side{position:fixed;right:0;top:0;z-index:90;transform:translateX(100%);transition:.25s}.side.open{transform:none}.main{padding:0 12px 40px}.g2{grid-template-columns:1fr}.mbtn{display:inline-block!important}}
.mbtn{display:none}
</style>
</head>
<body data-theme="light">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs><symbol id="logo" viewBox="0 0 64 64"><path d="M14 4h36a10 10 0 0 1 10 10v26a10 10 0 0 1-10 10H32L20 61V50h-6A10 10 0 0 1 4 40V14A10 10 0 0 1 14 4z" fill="url(#rg)"/><path d="M21 21h8v19h14v8H21z" fill="#fff"/><path d="M18 19V11l5 4 4-7 4 7 5-4v8z" fill="#fbbf24"/></symbol></svg>

<div class="login" id="login" hidden>
  <form class="lbox" id="lform">
    <svg><use href="#logo"/></svg>
    <h1>لوحة التحكم</h1><p>The Leader In English — للمشرفين فقط</p>
    <label class="f"><span>البريد الإلكتروني</span><input type="email" id="lemail" required autocomplete="username" dir="ltr"></label>
    <label class="f"><span>كلمة المرور</span><input type="password" id="lpass" required autocomplete="current-password" dir="ltr"></label>
    <button class="btn main" style="width:100%;padding:13px" id="lbtn">تسجيل الدخول</button>
    <div class="err" id="lerr" style="display:none;margin-top:14px"></div>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="lg"><svg><use href="#logo"/></svg><div><b>The Leader</b><small>ADMIN PANEL</small></div></div>
    <nav class="nav">
      <a href="#overview" data-v="overview">📊 نظرة عامة</a>
      <a href="#courses" data-v="courses">📚 الكورسات والمحتوى</a>
      <a href="#students" data-v="students">🎓 الطلاب</a>
      <a href="#devices" data-v="devices">💻 الأجهزة وتسجيل الدخول</a>
      <a href="#codes" data-v="codes">🎟️ الاشتراكات والأكواد</a>
      <a href="#exams" data-v="exams">📝 الامتحانات والأسئلة</a>
      <a href="#results" data-v="results">🏆 النتائج والتصحيح</a>
      <a href="#reports" data-v="reports">📈 التقارير</a>
      <a href="#announcements" data-v="announcements">📢 الإعلانات</a>
      <a href="#admins" data-v="admins" id="navAdmins">🛡️ المشرفون</a>
    </nav>
  </aside>
  <main class="main">
    <div class="top"><div style="display:flex;align-items:center;gap:10px"><button class="btn sm ghost mbtn" id="menuBtn">☰</button><h1 id="title">نظرة عامة</h1></div>
      <div class="tl"><span id="meMail"></span><button class="btn sm ghost" id="themeBtn">🌙</button><button class="btn sm bad" id="outBtn">خروج</button></div></div>
    <div id="view"></div>
  </main>
</div>
<div id="modal"></div><div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="core.js"></script>
<script src="courses.js"></script>
<script src="students.js"></script>
<script src="exams.js"></script>

</body>
</html>
