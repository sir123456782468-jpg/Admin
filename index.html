<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Leader In English - المنصة التعليمية</title>
    <!-- خطوط عربية وإنجليزية فخمة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
    <!-- مكتبة Supabase للربط بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            /* الألوان الفاتحة الرايقة والمريحة للعين */
            --bg-gradient: radial-gradient(circle at 50% 20%, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-primary: #0284c7;
            --accent-glow: rgba(2, 132, 199, 0.15);
            --border-color: rgba(2, 132, 199, 0.15);
            --led-color: #38bdf8;
            --pattern-color: rgba(2, 132, 199, 0.02);
        }

        [data-theme="dark"] {
            /* الألوان الداكنة المريحة للعين (هادئة وبعيدة عن التباين المؤذي) */
            --bg-gradient: radial-gradient(circle at 50% 20%, #0f172a 0%, #0b1120 50%, #020617 100%);
            --card-bg: rgba(15, 23, 42, 0.85);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-primary: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.2);
            --border-color: rgba(56, 189, 248, 0.2);
            --led-color: #38bdf8;
            --pattern-color: rgba(56, 189, 248, 0.02);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            padding: 25px;
            position: relative;
        }

        /* خلفية هندسية خفيفة جداً ومريحة */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(var(--pattern-color) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 0;
            pointer-events: none;
        }

        /* دوائر إضاءة خلفية هادئة جداً */
        .ambient-glow-1 {
            position: absolute;
            top: 15%;
            left: 20%;
            width: 250px;
            height: 250px;
            background: var(--accent-glow);
            filter: blur(100px);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        /* زر تبديل الوضع (داكن / فاتح) */
        .theme-toggle {
            position: absolute;
            top: 25px;
            left: 25px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(12px);
        }
        .theme-toggle:hover {
            transform: scale(1.05);
            border-color: var(--accent-primary);
        }

        /* الهيدر العلوي: اسم المستر نظيف وبدون علامات مزعجة */
        header {
            text-align: center;
            margin-top: 20px;
            position: relative;
            z-index: 2;
        }

        .teacher-title {
            font-family: 'Cinzel', serif;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f59e0b 0%, #ec4899 50%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            display: inline-block;
        }

        /* خط إضاءة ليد هادئ تحت اسم المستر */
        .teacher-title::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
            box-shadow: 0 0 10px var(--led-color);
            border-radius: 50%;
        }

        .developer-credit {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 10px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* منتصف الشاشة: إطار المنصة النظيف بدون علامات زوايا */
        .hero-section {
            text-align: center;
            margin: auto 0;
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 900px;
            padding: 40px 30px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
        }

        .main-heading {
            font-family: 'Cinzel', serif;
            font-size: clamp(26px, 4vw, 50px);
            font-weight: 800;
            color: var(--text-main);
            min-height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            position: relative;
            letter-spacing: 1px;
        }

        .main-heading span {
            background: linear-gradient(90deg, var(--text-main), var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* مؤشر الكتابة الحرفية */
        .typing-cursor {
            display: inline-block;
            width: 3px;
            height: 40px;
            background-color: var(--accent-primary);
            margin-right: 6px;
            animation: blinkCursor 0.8s infinite;
            vertical-align: middle;
            border-radius: 2px;
        }
        .typing-cursor.hidden {
            display: none !important;
        }

        .hero-subtitle {
            font-size: 15px;
            color: var(--text-muted);
            margin-top: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        @keyframes blinkCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* الأزرار السفلية مع إضاءة ليد ناعمة */
        .actions-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 550px;
            z-index: 2;
        }

        .led-btn-wrapper {
            position: relative;
            flex: 1;
            border-radius: 16px;
            padding: 2px;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.15), rgba(236, 72, 153, 0.15));
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        .led-btn-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, transparent, transparent, #ec4899, #38bdf8, #f59e0b);
            animation: rotateLed 5s linear infinite;
        }

        @keyframes rotateLed {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .led-btn {
            position: relative;
            background: var(--card-bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px 22px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            z-index: 1;
            backdrop-filter: blur(15px);
            transition: transform 0.3s ease, background 0.3s ease, color 0.3s ease;
        }

        .led-btn:hover {
            transform: translateY(-3px);
            background: var(--accent-primary);
            color: #ffffff;
        }

        footer {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            z-index: 2;
            letter-spacing: 1px;
        }

        @media(max-width: 768px) {
            .actions-container {
                flex-direction: column;
                gap: 15px;
            }
            .teacher-title {
                font-size: 24px;
            }
            .hero-section {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body data-theme="light">

    <div class="ambient-glow-1"></div>

    <!-- زر تبديل الثيم -->
    <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span> <span id="themeText">الوضع الداكن</span>
    </button>

    <!-- الهيدر -->
    <header>
        <h1 class="teacher-title">Mr. Sherif Khafagy</h1>
        <div class="developer-credit">Developed By / Mohamed Sherif Khafagy</div>
    </header>

    <!-- منتصف الشاشة -->
    <div class="hero-section">
        <h2 class="main-heading">
            <span id="typedText"></span><span class="typing-cursor" id="typingCursor"></span>
        </h2>
        <p class="hero-subtitle">بوابتك الاحترافية لاحتراف اللغة الإنجليزية بأحدث أساليب التعليم الذكي</p>
    </div>

    <!-- الأزرار السفلية -->
    <div class="actions-container">
        <div class="led-btn-wrapper">
            <a href="signup.html" class="led-btn">إنشاء حساب (Sign Up)</a>
        </div>
        <div class="led-btn-wrapper">
            <a href="signin.html" class="led-btn">تسجيل الدخول (Sign In)</a>
        </div>
    </div>

    <footer>
        &copy; 2026 The Leader In English. All Rights Reserved.
    </footer>

    <script>
        const SUPABASE_URL = 'https://cxtmvsoxgfsormhcklfx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4dG12c294Z2Zzb3JtaGNrbGZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNzI4MjQsImV4cCI6MjEwNTg0ODgyNH0.9zsPxYkMvHuRoe1R-XW8xOEUsE3IvoPP_r-iYXU_5s8';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // لو الطالب مسجل دخوله بالفعل ينتقل مباشرة للصفحة الرئيسية
        async function redirectIfLoggedIn() {
            try {
                const { data } = await supabaseClient.auth.getSession();
                if (data && data.session) {
                    const { data: profile } = await supabaseClient
                        .from('profiles').select('id').eq('id', data.session.user.id).maybeSingle();
                    if (profile) { window.location.replace('home.html'); return; }
                }
            } catch (e) { console.error(e); }
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('platform_theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
            updateThemeToggleUI(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('platform_theme', newTheme);
            updateThemeToggleUI(newTheme);
        }

        function updateThemeToggleUI(theme) {
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            if (theme === 'dark') {
                icon.innerText = '☀️';
                text.innerText = 'الوضع الفاتح';
            } else {
                icon.innerText = '🌙';
                text.innerText = 'الوضع الداكن';
            }
        }

        const textTarget = document.getElementById('typedText');
        const cursorTarget = document.getElementById('typingCursor');
        const phrase = "The Leader In English";
        let charIndex = 0;

        function typeWriterEffect() {
            if (charIndex < phrase.length) {
                textTarget.innerHTML += phrase.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriterEffect, 100);
            } else {
                cursorTarget.classList.add('hidden');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            redirectIfLoggedIn();
            setTimeout(typeWriterEffect, 600);
        });
    </script>
</body>
</html>
