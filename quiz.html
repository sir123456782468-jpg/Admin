<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الامتحان | The Leader In English</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>:root{--bg:#eef3fb;--card:#fff;--ink:#172033;--muted:#707b8f;--line:#e3e8f0;--brand:#ef4444;--green:#16a34a;--yellow:#f59e0b;--blue:#2563eb;--shadow:0 14px 40px rgba(15,23,42,.08)}*{box-sizing:border-box;font-family:Cairo,sans-serif}body{margin:0;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 20px;position:sticky;top:0;z-index:30}.brand{display:flex;align-items:center;gap:10px}.logo{width:45px;height:45px;border-radius:14px;background:linear-gradient(135deg,var(--brand),#ec4899);color:#fff;display:grid;place-items:center;font-weight:900}.brand b{display:block}.brand small{color:var(--brand);font-weight:800}.topRight{display:flex;align-items:center;gap:9px}.timer{font-size:22px;font-weight:900;background:#f8fafc;border:1px solid var(--line);padding:7px 14px;border-radius:12px;direction:ltr}.wrap{max-width:1250px;margin:auto;padding:20px}.examHead{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:15px}.examHead h1{margin:0 0 5px;font-size:25px}.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;margin-top:16px}.qcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}.qtop{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{padding:8px 13px;border-radius:999px;background:#eef2ff;color:#4f46e5;font-weight:800}.points{background:#fff7ed;color:#b45309}.qtext{font-size:21px;line-height:1.8;font-weight:800;margin:20px 0}.options{display:grid;gap:10px}.opt{border:2px solid var(--line);padding:14px;border-radius:14px;background:#fff;text-align:right;font-weight:700}.opt:hover{border-color:#93c5fd}.opt.selected{border-color:var(--blue);background:#eff6ff}.short,.essay{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px;min-height:90px;resize:vertical}.navbox{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:var(--shadow);height:max-content;position:sticky;top:90px}.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.num{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px}.num.current{background:var(--green);color:#fff}.num.answered{border-color:var(--green)}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.btn{border:1px solid var(--line);background:#fff;padding:11px 18px;border-radius:12px;font-weight:900}.btn.primary{background:var(--green);color:#fff;border:0}.btn.danger{background:#ef4444;color:#fff;border:0}.btn.warn{background:#f59e0b;color:#fff;border:0}.status{padding:12px;border-radius:12px;background:#f8fafc;margin-top:12px;font-size:13px}.result{background:#fff;border:1px solid var(--line);border-radius:22px;padding:35px;text-align:center;box-shadow:var(--shadow)}.result h1{font-size:32px;color:var(--green)}@media(max-width:850px){.layout{grid-template-columns:1fr}.navbox{position:static}.examHead{flex-direction:column}.timer{align-self:flex-start}}@media(max-width:550px){.wrap{padding:10px}.qcard{padding:15px}.qtext{font-size:18px}.nums{grid-template-columns:repeat(5,1fr)}}
</style></head><body><header class="top"><div class="brand"><div class="logo">LE</div><div><b id="platformName">The Leader In English</b><small id="teacherName">Mr Sherif Khafagy</small></div></div><div class="topRight"><div id="timer" class="timer">--:--</div><button class="btn" onclick="location.href='home.html'">خروج</button></div></header><div class="wrap"><section id="examHead" class="examHead"><div><h1 id="title">جاري تحميل الامتحان...</h1><div id="info" class="muted"></div></div><div id="examState" class="pill">...</div></section><div id="app" class="layout" style="display:none"><main class="qcard"><div class="qtop"><span id="qNo" class="pill">السؤال 1</span><span id="points" class="pill points">درجة 1</span></div><div id="qText" class="qtext"></div><div id="answer"></div><div class="actions"><button id="prev" class="btn">السابق</button><button id="next" class="btn primary">التالي</button></div></main><aside class="navbox"><b>أسئلة الامتحان</b><div id="nums" class="nums"></div><div class="status">الأخضر = تمت الإجابة<br>الأبيض = لم تتم الإجابة</div><button id="submit" class="btn danger" style="width:100%;margin-top:12px">تسليم نهائي</button></aside></div><div id="result" style="display:none;margin-top:16px"></div></div>
<script>
const SUPABASE_URL='https://cxtmvsoxgfsormhcklfx.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmF0ZSIsInJlZiI6ImN4dG12c294Z2Zzb3JtaGNrbGZ4IiwiaWF0IjoxNzkwMjcyODI0LCJleHAiOjIxMDU4NDg4MjB9.9zsPxYkMvHuRoe1R-XW8xOEUsE3IvoPP_r-iYXU_5s8';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const quizId=new URLSearchParams(location.search).get('id');
let quiz,attempt,questions=[],answers={},idx=0,timerInt;
const esc=x=>String(x??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
function fail(t){examState.textContent='غير متاح';app.style.display='none';result.style.display='block';result.innerHTML=`<div class="result"><h1 style="color:#ef4444">${esc(t)}</h1><button class="btn primary" onclick="location.href='home.html'">العودة للمنصة</button></div>`;timer.textContent='--:--'}
function formatTime(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
async function init(){
 const {data:{session}}=await sb.auth.getSession(); if(!session)return location.replace('signin.html');
 const [qz,set]=await Promise.all([sb.from('quizzes').select('*,courses(title)').eq('id',quizId).single(),sb.from('platform_settings').select('*').eq('id',true).single()]);
 if(qz.error)return fail('الامتحان غير موجود'); quiz=qz.data;
 if(set.data){platformName.textContent=set.data.platform_name;teacherName.textContent=set.data.teacher_name}
 title.textContent=quiz.title; info.textContent=`${quiz.courses?.title||'اختبار'} • ${quiz.duration_minutes} دقيقة`;
 const now=Date.now();
 if(quiz.open_at&&now<new Date(quiz.open_at).getTime())return fail('الامتحان لم يفتح بعد.');
 if(quiz.close_at&&now>new Date(quiz.close_at).getTime())return fail('انتهى وقت فتح الامتحان.');
 const {data:attempts,error:ae}=await sb.from('quiz_attempts').select('*').eq('quiz_id',quizId).eq('student_id',session.user.id).order('created_at',{ascending:false});
 if(ae)return fail('تعذر تحميل محاولات الامتحان.');
 const active=(attempts||[]).find(a=>a.status==='in_progress');
 if(active)attempt=active; else {
   const {data:newA,error}=await sb.from('quiz_attempts').insert({quiz_id:quizId,student_id:session.user.id,status:'in_progress',total:0}).select('*').single();
   if(error)return fail('تعذر بدء الامتحان: '+error.message); attempt=newA;
 }
 const {data:qs,error}=await sb.from('quiz_questions').select('id,question_type,question_text,options,points,sort_order,is_required').eq('quiz_id',quizId).order('sort_order');
 if(error)return fail('تعذر تحميل الأسئلة'); questions=qs||[]; if(!questions.length)return fail('الامتحان لا يحتوي على أسئلة.');
 const {data:oldAns}=await sb.from('quiz_answers').select('question_id,selected_option,answer_text').eq('attempt_id',attempt.id);(oldAns||[]).forEach(a=>answers[a.question_id]={selected:a.selected_option,text:a.answer_text});
 app.style.display='grid';examState.textContent='جاري الحل';render();startTimer();
}
function render(){const q=questions[idx];qNo.textContent=`السؤال ${idx+1} من ${questions.length}`;points.textContent=`درجة ${q.points}`;qText.textContent=q.question_text;const a=answers[q.id]||{};
 if(q.question_type==='essay')answer.innerHTML=`<textarea class="essay" id="ans" placeholder="اكتب إجابتك هنا...">${esc(a.text||'')}</textarea>`;
 else if(q.question_type==='short_answer'||q.question_type==='true_false')answer.innerHTML=q.question_type==='true_false'?'<div class="options"><button class="opt" data-opt="true">صح</button><button class="opt" data-opt="false">خطأ</button></div>':`<input class="short" id="ans" value="${esc(a.text||'')}" placeholder="اكتب الإجابة...">`;
 else answer.innerHTML='<div class="options">'+(q.options||[]).map(o=>`<button class="opt ${a.selected===o.id?'selected':''}" data-opt="${esc(o.id)}">${esc(o.text)}</button>`).join('')+'</div>';
 answer.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{answers[q.id]={selected:b.dataset.opt};save(q);render()});
 const inp=document.getElementById('ans');if(inp)inp.onblur=()=>{answers[q.id]={text:inp.value};save(q)};
 nums.innerHTML=questions.map((x,i)=>`<button class="num ${i===idx?'current':''} ${answers[x.id]?'answered':''}" onclick="go(${i})">${i+1}</button>`).join('');prev.disabled=idx===0;next.textContent=idx===questions.length-1?'تسليم':'التالي';
}
async function save(q){const a=answers[q.id]||{};const payload={attempt_id:attempt.id,question_id:q.id,selected_option:a.selected||null,answer_text:a.text||null};const r=await sb.from('quiz_answers').upsert(payload,{onConflict:'attempt_id,question_id'});if(r.error)console.warn(r.error.message)}
async function go(i){if(i===idx)return;await save(questions[idx]);idx=i;render()}
prev.onclick=()=>go(idx-1);next.onclick=()=>idx<questions.length-1?go(idx+1):confirmSubmit();submit.onclick=confirmSubmit;
async function confirmSubmit(){await save(questions[idx]);if(!confirm('متأكد إنك عايز تسلم الامتحان نهائيًا؟'))return;finish(false)}
async function finish(auto){clearInterval(timerInt);for(const q of questions)await save(q);const {data:ans}=await sb.from('quiz_answers').select('question_id,selected_option,answer_text').eq('attempt_id',attempt.id);const {data:keys}=await sb.from('quiz_question_keys').select('question_id,correct_option,correct_answer').in('question_id',questions.filter(q=>q.question_type!=='essay').map(q=>q.id));const km=new Map((keys||[]).map(k=>[k.question_id,k]));let score=0,total=questions.reduce((s,q)=>s+Number(q.points||0),0);for(const a of ans||[]){const q=questions.find(x=>x.id===a.question_id),k=km.get(a.question_id);if(q&&k&&q.question_type!=='essay'){const correct=k.correct_option||k.correct_answer;const ok=String(a.selected_option||a.answer_text||'').trim().toLowerCase()===String(correct||'').trim().toLowerCase();await sb.from('quiz_answers').update({is_correct:ok,points_awarded:ok?Number(q.points||0):0}).eq('attempt_id',attempt.id).eq('question_id',q.id);if(ok)score+=Number(q.points||0)}}
 const hasEssay=questions.some(q=>q.question_type==='essay');if(hasEssay){for(const q of questions.filter(x=>x.question_type==='essay')){const a=(ans||[]).find(x=>x.question_id===q.id);await sb.from('essay_submissions').upsert({attempt_id:attempt.id,question_id:q.id,student_id:attempt.student_id,answer_text:a?.answer_text||''},{onConflict:'attempt_id,question_id'})}}
 const {data:up,error}=await sb.from('quiz_attempts').update({score,total,submitted_at:new Date().toISOString(),status:auto?'auto_submitted':'submitted',updated_at:new Date().toISOString()}).eq('id',attempt.id).select('*').single();if(error)return fail(error.message);app.style.display='none';timer.textContent='00:00';examState.textContent='تم التسليم';result.style.display='block';const show=quiz.result_visibility==='immediate';result.innerHTML=`<div class="result"><h1>${show?'تم تصحيح الامتحان':'تم تسليم الامتحان'}</h1><p class="muted">${auto?'انتهى الوقت وتم التسليم تلقائيًا.':'تم حفظ إجاباتك بنجاح.'}</p>${show?`<div style="font-size:35px;font-weight:900;margin:18px">${score} / ${total}</div><p>${total?Math.round(score/total*100):0}%</p>`:''}</div>`}
function startTimer(){const start=new Date(attempt.started_at).getTime();const end=start+Number(quiz.duration_minutes||60)*60000;const tick=()=>{const left=Math.ceil((end-Date.now())/1000);timer.textContent=formatTime(left);if(left<=0)finish(true)};tick();timerInt=setInterval(tick,1000)}
init();
</script></body></html>
