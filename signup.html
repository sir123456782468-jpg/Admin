<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - The Leader In English</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 20%, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-primary: #ef4444;
            --border-color: rgba(239, 68, 68, 0.2);
            --input-bg: rgba(255, 255, 255, 0.8);
        }
        [data-theme="dark"] {
            --bg-gradient: radial-gradient(circle at 50% 20%, #0f172a 0%, #0b1120 50%, #020617 100%);
            --card-bg: rgba(15, 23, 42, 0.85);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-primary: #f87171;
            --border-color: rgba(248, 113, 113, 0.25);
            --input-bg: rgba(15, 23, 42, 0.6);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 25px; position: relative; }
        .theme-toggle { position: absolute; top: 25px; left: 25px; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 18px; border-radius: 50px; cursor: pointer; font-weight: 700; font-size: 13px; z-index: 10; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(12px); }
        header { text-align: center; margin-top: 15px; z-index: 2; }
        .teacher-title { font-family: 'Cinzel', serif; font-size: 28px; font-weight: 800; color: var(--accent-primary); }
        .form-container { width: 100%; max-width: 650px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 24px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); backdrop-filter: blur(16px); margin: 20px 0; z-index: 2; }
        .form-title { font-size: 22px; font-weight: 800; text-align: center; margin-bottom: 25px; color: var(--text-main); }
        .name-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        label { font-size: 14px; font-weight: 700; color: var(--text-main); }
        input, select { width: 100%; padding: 14px 16px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-main); font-size: 15px; outline: none; }
        input:focus, select:focus { border-color: var(--accent-primary); box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
        select option { background: var(--card-bg); color: var(--text-main); }
        .submit-btn-wrapper { border-radius: 16px; padding: 2px; overflow: hidden; margin-top: 10px; background: var(--accent-primary); }
        .submit-btn { width: 100%; background: var(--card-bg); color: var(--text-main); border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; backdrop-filter: blur(15px); }
        .submit-btn:hover { background: var(--accent-primary); color: #ffffff; }
        .select { position: relative; --panel-bg: #ffffff; }
        [data-theme="dark"] .select { --panel-bg: #0f172a; }
        .select-trigger { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-muted); font-size: 15px; cursor: pointer; outline: none; }
        .select-trigger.has-value { color: var(--text-main); font-weight: 700; }
        .select.open .select-trigger, .select-trigger:focus { border-color: var(--accent-primary); box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
        .chev { width: 18px; height: 18px; color: var(--accent-primary); transition: transform 0.25s ease; }
        .select.open .chev { transform: rotate(180deg); }
        .select-panel { position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 30; max-height: 330px; overflow-y: auto; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.18); padding: 8px; opacity: 0; transform: translateY(-8px) scale(0.98); pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; }
        .select.open .select-panel { opacity: 1; transform: none; pointer-events: auto; }
        .grp { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: var(--accent-primary); padding: 10px 12px 6px; }
        .grp::after { content: ""; flex: 1; height: 1px; background: var(--border-color); }
        .opt { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: 600; color: var(--text-main); outline: none; }
        .opt:hover, .opt:focus { background: rgba(239, 68, 68, 0.1); }
        .opt[aria-selected="true"] { background: var(--accent-primary); color: #ffffff; }
        .tick { width: 18px; height: 18px; opacity: 0; }
        .opt[aria-selected="true"] .tick { opacity: 1; }
        .form-msg { display: none; margin-top: 16px; padding: 12px 14px; border-radius: 12px; font-size: 14px; font-weight: 600; text-align: center; line-height: 1.8; background: rgba(239,68,68,0.1); border: 1px solid var(--border-color); color: var(--text-main); }
        .form-msg a { color: var(--accent-primary); font-weight: 800; }
        footer { font-size: 11px; color: var(--text-muted); text-align: center; z-index: 2; }
        @media(max-width: 768px) { .name-row { grid-template-columns: 1fr; gap: 15px; } }
    </style>
</head>
<body data-theme="light">
    <button class="theme-toggle" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span> <span id="themeText">الوضع الداكن</span>
    </button>

    <header>
        <h1 class="teacher-title">Mr. Sherif Khafagy</h1>
    </header>

    <div class="form-container">
        <h2 class="form-title">إنشاء حساب جديد (الخطوة 1: البيانات الأساسية)</h2>
        <form id="signupForm" onsubmit="handleFirstStep(event)">
            <div class="name-row">
                <div class="input-group">
                    <label>الاسم الأول</label>
                    <input type="text" id="firstName" required>
                </div>
                <div class="input-group">
                    <label>الاسم الثاني</label>
                    <input type="text" id="middleName" required>
                </div>
                <div class="input-group">
                    <label>الاسم الأخير</label>
                    <input type="text" id="lastName" required>
                </div>
            </div>

            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="studentEmail" placeholder="example@domain.com" required>
            </div>

            <div class="input-group">
                <label>السنة الدراسية (الصف)</label>
                <div class="select" id="yearSelect">
                    <input type="hidden" id="academicYear" value="">
                    <button type="button" class="select-trigger" id="yearTrigger" aria-haspopup="listbox" aria-expanded="false">
                        <span id="yearText">اختر السنة الدراسية</span>
                        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                    </button>
                    <div class="select-panel" role="listbox" id="yearPanel">
                        <div class="grp">المرحلة الإعدادية</div>
                        <div class="opt" role="option" tabindex="0" data-v="أولى إعدادي">أولى إعدادي<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
                        <div class="opt" role="option" tabindex="0" data-v="ثانية إعدادي">ثانية إعدادي<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
                        <div class="opt" role="option" tabindex="0" data-v="ثالثة إعدادي">ثالثة إعدادي<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
                        <div class="grp">المرحلة الثانوية</div>
                        <div class="opt" role="option" tabindex="0" data-v="أولى ثانوي">أولى ثانوي<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
                        <div class="opt" role="option" tabindex="0" data-v="ثانية ثانوي">ثانية ثانوي<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
                        <div class="opt" role="option" tabindex="0" data-v="ثالثة ثانوي">ثالثة ثانوي<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label>رقم الهاتف الشخصي</label>
                <input type="tel" id="studentPhone" placeholder="01xxxxxxxxx" maxlength="11" required>
            </div>

            <div class="input-group">
                <label>رقم ولي الأمر</label>
                <input type="tel" id="parentPhone" placeholder="01xxxxxxxxx" maxlength="11" required>
            </div>

            <div class="submit-btn-wrapper">
                <button type="submit" class="submit-btn" id="submitBtn">إرسال كود التحقق 🚀</button>
            </div>
            <div class="form-msg" id="formMsg"></div>
        </form>
    </div>

    <footer>&copy; 2026 The Leader In English. All Rights Reserved.</footer>

    <script>
        const SUPABASE_URL = 'https://cxtmvsoxgfsormhcklfx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4dG12c294Z2Zzb3JtaGNrbGZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNzI4MjQsImV4cCI6MjEwNTg0ODgyNH0.9zsPxYkMvHuRoe1R-XW8xOEUsE3IvoPP_r-iYXU_5s8'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('platform_theme', newTheme);
            document.getElementById('themeIcon').innerText = newTheme === 'dark' ? '☀️' : '🌙';
            document.getElementById('themeText').innerText = newTheme === 'dark' ? 'الوضع الفاتح' : 'الوضع الداكن';
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const savedTheme = localStorage.getItem('platform_theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
            document.getElementById('themeIcon').innerText = savedTheme === 'dark' ? '☀️' : '🌙';
            document.getElementById('themeText').innerText = savedTheme === 'dark' ? 'الوضع الفاتح' : 'الوضع الداكن';

            // لو الطالب مسجل دخوله بالفعل ينتقل للصفحة الرئيسية
            try {
                const { data } = await supabaseClient.auth.getSession();
                if (data && data.session) {
                    const { data: profile } = await supabaseClient
                        .from('profiles').select('id').eq('id', data.session.user.id).maybeSingle();
                    if (profile) { window.location.replace('home.html'); return; }
                }
            } catch (e) { console.error(e); }
        });

        // قائمة السنة الدراسية
        const yearSelect = document.getElementById('yearSelect');
        const yearTrigger = document.getElementById('yearTrigger');
        const yearOpts = Array.from(document.querySelectorAll('#yearPanel .opt'));
        function setOpen(o) { yearSelect.classList.toggle('open', o); yearTrigger.setAttribute('aria-expanded', o); }
        function pickYear(opt) {
            yearOpts.forEach(x => x.setAttribute('aria-selected', x === opt));
            document.getElementById('academicYear').value = opt.dataset.v;
            document.getElementById('yearText').textContent = opt.dataset.v;
            yearTrigger.classList.add('has-value');
            document.getElementById('formMsg').style.display = 'none';
            setOpen(false);
            yearTrigger.focus();
        }
        yearTrigger.addEventListener('click', () => setOpen(!yearSelect.classList.contains('open')));
        yearTrigger.addEventListener('keydown', e => { if (e.key === 'ArrowDown') { e.preventDefault(); setOpen(true); yearOpts[0].focus(); } });
        yearOpts.forEach((opt, i) => {
            opt.addEventListener('click', () => pickYear(opt));
            opt.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickYear(opt); }
                if (e.key === 'ArrowDown') { e.preventDefault(); (yearOpts[i + 1] || opt).focus(); }
                if (e.key === 'ArrowUp') { e.preventDefault(); (yearOpts[i - 1] || opt).focus(); }
            });
        });
        document.addEventListener('click', e => { if (!yearSelect.contains(e.target)) setOpen(false); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') setOpen(false); });

        function showMsg(html) {
            const box = document.getElementById('formMsg');
            box.innerHTML = html;
            box.style.display = 'block';
        }

        async function handleFirstStep(event) {
            event.preventDefault();
            document.getElementById('formMsg').style.display = 'none';

            const email = document.getElementById('studentEmail').value.trim().toLowerCase();
            const phone = document.getElementById('studentPhone').value.trim();
            const parentPhone = document.getElementById('parentPhone').value.trim();
            const academicYear = document.getElementById('academicYear').value;
            const btn = document.getElementById('submitBtn');
            const phoneRegex = /^01[0-9]{9}$/;

            if (!academicYear) {
                showMsg('برجاء اختيار السنة الدراسية');
                return;
            }

            if (!phoneRegex.test(phone)) {
                showMsg('رقم الهاتف الشخصي غير صحيح، يجب أن يتكون من 11 رقماً ويبدأ بـ 01');
                return;
            }
            if (!phoneRegex.test(parentPhone)) {
                showMsg('رقم ولي الأمر غير صحيح، يجب أن يتكون من 11 رقماً ويبدأ بـ 01');
                return;
            }
            if (phone === parentPhone) {
                showMsg('رقم ولي الأمر يجب أن يكون مختلفاً عن رقمك الشخصي');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'جاري التحقق وإرسال الكود...';

            try {
                // 1) هل الطالب مسجل قبل كده؟ (بالإيميل أو رقم الهاتف)
                const { data: exists, error: checkError } = await supabaseClient
                    .rpc('student_exists', { p_email: email, p_student_code: phone });

                if (checkError) throw checkError;

                if (exists === true) {
                    showMsg('يوجد حساب مسجل بالفعل بهذا البريد الإلكتروني أو رقم الهاتف.<br><a href="signin.html">سجّل الدخول من هنا</a>');
                    btn.disabled = false;
                    btn.innerText = 'إرسال كود التحقق 🚀';
                    return;
                }

                // 2) Supabase يرسل كود التحقق على الإيميل
                const { error: otpError } = await supabaseClient.auth.signInWithOtp({
                    email: email,
                    options: { shouldCreateUser: true }
                });

                if (otpError) throw otpError;

                // 3) نحفظ البيانات مؤقتاً (بدون أي كود) وننتقل لصفحة التحقق
                const tempData = {
                    firstName: document.getElementById('firstName').value.trim(),
                    middleName: document.getElementById('middleName').value.trim(),
                    lastName: document.getElementById('lastName').value.trim(),
                    studentEmail: email,
                    academicYear: academicYear,
                    studentPhone: phone,
                    parentPhone: parentPhone
                };

                localStorage.setItem('temp_signup_data', JSON.stringify(tempData));
                window.location.href = 'verify-code.html';

            } catch (err) {
                console.error('Signup step error:', err);
                const msg = (err.message || '').toLowerCase().includes('rate')
                    ? 'تم إرسال طلبات كثيرة، برجاء الانتظار دقيقة ثم المحاولة مرة أخرى.'
                    : 'حدث خطأ أثناء الإرسال، برجاء المحاولة مرة أخرى.';
                showMsg(msg);
                btn.disabled = false;
                btn.innerText = 'إرسال كود التحقق 🚀';
            }
        }
    </script>
</body>
</html>
