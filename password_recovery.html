<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور - The Leader In English</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 20%, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-primary: #ef4444;
            --border-color: rgba(239, 68, 68, 0.2);
            --input-bg: rgba(255, 255, 255, 0.8);
        }
        [data-theme="dark"] {
            --bg-gradient: radial-gradient(circle at 50% 20%, #0f172a 0%, #0b1120 50%, #020617 100%);
            --card-bg: rgba(15, 23, 42, 0.85);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-primary: #f87171;
            --border-color: rgba(248, 113, 113, 0.25);
            --input-bg: rgba(15, 23, 42, 0.6);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 25px; position: relative; }
        .theme-toggle { position: absolute; top: 25px; left: 25px; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 18px; border-radius: 50px; cursor: pointer; font-weight: 700; font-size: 13px; z-index: 10; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(12px); }
        header { text-align: center; margin-top: 15px; z-index: 2; }
        .teacher-title { font-family: 'Cinzel', serif; font-size: 28px; font-weight: 800; color: var(--accent-primary); }
        .form-container { width: 100%; max-width: 480px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 24px; padding: 34px 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); backdrop-filter: blur(16px); margin: 20px 0; z-index: 2; }
        .icon-circle { width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 34px; background: rgba(239, 68, 68, 0.1); border: 2px dashed var(--accent-primary); }
        .form-title { font-size: 22px; font-weight: 800; text-align: center; margin-bottom: 8px; }
        .form-desc { font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 24px; line-height: 1.8; }
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
        label { font-size: 14px; font-weight: 700; }
        .pass-wrap { position: relative; }
        input { width: 100%; padding: 14px 16px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-main); font-size: 15px; outline: none; }
        .pass-wrap input { padding-left: 48px; }
        input:focus { border-color: var(--accent-primary); box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
        .eye { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 18px; cursor: pointer; }
        .strength { height: 6px; border-radius: 6px; background: rgba(148,163,184,0.25); overflow: hidden; }
        .strength span { display: block; height: 100%; width: 0; border-radius: 6px; transition: width .3s, background .3s; }
        .hint { font-size: 12px; color: var(--text-muted); }
        .submit-btn-wrapper { border-radius: 16px; padding: 2px; overflow: hidden; margin-top: 10px; background: var(--accent-primary); }
        .submit-btn { width: 100%; background: var(--card-bg); color: var(--text-main); border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; backdrop-filter: blur(15px); }
        .submit-btn:hover:not(:disabled) { background: var(--accent-primary); color: #ffffff; }
        .submit-btn:disabled { opacity: .7; cursor: not-allowed; }
        .form-msg { display: none; margin-top: 16px; padding: 12px 14px; border-radius: 12px; font-size: 14px; font-weight: 600; line-height: 1.8; text-align: center; background: rgba(239, 68, 68, 0.1); border: 1px solid var(--border-color); }
        .form-msg.ok { background: rgba(34, 197, 94, 0.12); border-color: rgba(34, 197, 94, 0.4); }
        footer { font-size: 11px; color: var(--text-muted); text-align: center; z-index: 2; }
    </style>
</head>
<body data-theme="light">
    <button class="theme-toggle" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span> <span id="themeText">الوضع الداكن</span>
    </button>

    <header>
        <h1 class="teacher-title">Mr. Sherif Khafagy</h1>
    </header>

    <div class="form-container">
        <div class="icon-circle">🔑</div>
        <h2 class="form-title">نسيت كلمة المرور؟</h2>
        <p class="form-desc">اكتب بريدك الإلكتروني المسجل في المنصة وسنرسل لك كود استعادة الحساب.</p>

        <form id="recoveryForm" onsubmit="handleRecovery(event)">
            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="example@gmail.com" autocomplete="email" required>
            </div>
            <div class="submit-btn-wrapper">
                <button type="submit" class="submit-btn" id="submitBtn">إرسال كود الاستعادة 🚀</button>
            </div>
            <div class="form-msg" id="formMsg"></div>
        </form>

        <p class="form-desc" style="margin:22px 0 0;"><a href="signin.html" style="color:var(--accent-primary);font-weight:800;text-decoration:none;">العودة لتسجيل الدخول</a></p>
    </div>

    <footer>&copy; 2026 The Leader In English. All Rights Reserved.</footer>

    <script>
        const SUPABASE_URL = 'https://cxtmvsoxgfsormhcklfx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4dG12c294Z2Zzb3JtaGNrbGZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNzI4MjQsImV4cCI6MjEwNTg0ODgyNH0.9zsPxYkMvHuRoe1R-XW8xOEUsE3IvoPP_r-iYXU_5s8';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function toggleTheme() {
            const t = document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', t);
            localStorage.setItem('platform_theme', t);
            document.getElementById('themeIcon').innerText = t === 'dark' ? '☀️' : '🌙';
            document.getElementById('themeText').innerText = t === 'dark' ? 'الوضع الفاتح' : 'الوضع الداكن';
        }
        function showMsg(text, ok) {
            const box = document.getElementById('formMsg');
            box.textContent = text;
            box.className = 'form-msg' + (ok ? ' ok' : '');
            box.style.display = 'block';
        }
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('platform_theme') || 'light';
            document.body.setAttribute('data-theme', saved);
            document.getElementById('themeIcon').innerText = saved === 'dark' ? '☀️' : '🌙';
            document.getElementById('themeText').innerText = saved === 'dark' ? 'الوضع الفاتح' : 'الوضع الداكن';
        });

        async function handleRecovery(event) {
            event.preventDefault();
            document.getElementById('formMsg').style.display = 'none';
            const email = document.getElementById('email').value.trim().toLowerCase();
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.textContent = 'جاري الإرسال...';

            try {
                // لا نكشف هل الإيميل مسجل أم لا (حماية من تخمين الحسابات)
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email);
                if (error) throw error;

                localStorage.setItem('temp_recovery', JSON.stringify({ email: email }));
                sessionStorage.removeItem('recovery_verified');
                window.location.href = 'verify-recovery.html';

            } catch (err) {
                console.error('Recovery error:', err);
                const text = (err.message || '').toLowerCase();
                showMsg(text.includes('rate') || text.includes('seconds')
                    ? 'تم إرسال طلبات كثيرة، برجاء الانتظار دقيقة ثم المحاولة مرة أخرى.'
                    : 'حدث خطأ أثناء الإرسال، برجاء المحاولة مرة أخرى.');
                btn.disabled = false;
                btn.textContent = 'إرسال كود الاستعادة 🚀';
            }
        }
    </script>
</body>
</html>
