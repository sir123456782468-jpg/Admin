<!doctype html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>
        دخول الإدارة | The Leader In English
    </title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --ink: #0f172a;
            --muted: #64748b;
            --line: #e5e7eb;
            --brand: #ef4444;
        }

        [data-theme="dark"] {
            --bg: #09111f;
            --card: #111b2e;
            --ink: #f8fafc;
            --muted: #94a3b8;
            --line: #24324a;
        }

        * {
            box-sizing: border-box;
            font-family: Cairo, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top,
                    #ffffff,
                    #f4f6fb
                );
            background-color: var(--bg);
            color: var(--ink);
            display: grid;
            place-items: center;
            padding: 18px;
        }

        [data-theme="dark"] body {
            background: var(--bg);
        }

        .card {
            width: min(460px, 100%);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 25px;
            padding: 30px;
            box-shadow:
                0 20px 60px rgba(15, 23, 42, .12);
        }

        .logo {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            background:
                linear-gradient(
                    135deg,
                    #ef4444,
                    #ec4899
                );
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 25px;
            font-weight: 900;
            margin: auto;
        }

        .title {
            text-align: center;
            margin: 15px 0 4px;
            font-size: 24px;
            font-weight: 900;
        }

        .sub {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 24px;
        }

        .field {
            display: grid;
            gap: 7px;
            margin-bottom: 14px;
        }

        .field label {
            font-size: 13px;
            font-weight: 800;
        }

        .field input {
            width: 100%;
            padding: 13px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--bg);
            color: var(--ink);
            outline: none;
            transition: .2s;
        }

        .field input:focus {
            border-color: #ef4444;
            box-shadow:
                0 0 0 3px rgba(239, 68, 68, .10);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 13px;
            background:
                linear-gradient(
                    135deg,
                    #ef4444,
                    #ec4899
                );
            color: #fff;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            transition: .2s;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: .65;
            cursor: not-allowed;
            transform: none;
        }

        .msg {
            display: none;
            margin-top: 13px;
            padding: 11px;
            border-radius: 11px;
            background: rgba(239, 68, 68, .10);
            color: #dc2626;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
        }

        [data-theme="dark"] .msg {
            color: #fca5a5;
        }

        .foot {
            text-align: center;
            color: var(--muted);
            font-size: 11px;
            margin-top: 18px;
            line-height: 1.8;
        }

        .theme {
            position: fixed;
            top: 15px;
            left: 15px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink);
            padding: 8px 11px;
            border-radius: 12px;
            cursor: pointer;
        }

        .loading {
            pointer-events: none;
        }

    </style>

</head>


<body>

    <button
        class="theme"
        id="theme"
        type="button"
        aria-label="تغيير المظهر"
    >
        🌙
    </button>


    <div class="card">

        <div class="logo">
            LE
        </div>


        <h1 class="title">
            لوحة تحكم الإدارة
        </h1>


        <p class="sub">
            The Leader In English · Mr Sherif Khafagy
        </p>


        <form id="form">

            <div class="field">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <input
                    id="email"
                    type="email"
                    required
                    autocomplete="username"
                    placeholder="admin@example.com"
                >

            </div>


            <div class="field">

                <label for="password">
                    كلمة المرور
                </label>

                <input
                    id="password"
                    type="password"
                    required
                    autocomplete="current-password"
                    placeholder="••••••••"
                >

            </div>


            <button
                class="btn"
                id="submit"
                type="submit"
            >
                دخول الإدارة
            </button>


            <div
                class="msg"
                id="msg"
            ></div>

        </form>


        <div class="foot">

            هذه الصفحة منفصلة عن واجهة الطلاب.<br>

            صلاحية الإدارة يتم التحقق منها من Supabase.

        </div>

    </div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    'https://cxtmvsoxgfsormhcklfx.supabase.co';

const SUPABASE_ANON_KEY =
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsImF1ZCI6ImN4dG12c294Z2Zzb3JtaGNrbGZ4IiwiaWF0IjoxNzkwMjcyODI0LCJleHAiOjIxMDU4NDg4MjB9.9zsPxYkMvHuRoe1R-XW8xOEUsE3IvoPP_r-iYXU_5s8';

const sb =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   ELEMENTS
===================================================== */

const $ = id =>
    document.getElementById(id);


/* =====================================================
   MESSAGE
===================================================== */

function showMsg(text) {

    const box = $('msg');

    box.textContent = text;

    box.style.display = 'block';

}


function hideMsg() {

    $('msg').style.display = 'none';

}


/* =====================================================
   THEME
===================================================== */

const savedTheme =
    localStorage.getItem('admin_theme') || 'light';

document.body.dataset.theme =
    savedTheme;


$('theme').onclick = () => {

    const current =
        document.body.dataset.theme === 'dark'
            ? 'light'
            : 'dark';

    document.body.dataset.theme =
        current;

    localStorage.setItem(
        'admin_theme',
        current
    );

};


/* =====================================================
   CHECK ADMIN
===================================================== */

async function checkAdmin() {

    try {

        /*
         * أولاً نتأكد إن فيه Session
         */

        const {
            data: sessionData,
            error: sessionError
        } = await sb.auth.getSession();


        if (sessionError) {

            console.error(
                'SESSION ERROR:',
                sessionError
            );

            return false;

        }


        const session =
            sessionData?.session;


        if (!session) {

            return false;

        }


        const user =
            session.user;


        /*
         * التحقق من دالة is_admin
         */

        const {
            data: adminResult,
            error: adminError
        } = await sb.rpc('is_admin');


        if (
            !adminError &&
            adminResult === true
        ) {

            return true;

        }


        /*
         * احتياط:
         * قراءة profile الخاص بالمستخدم
         */

        const {
            data: profile,
            error: profileError
        } = await sb
            .from('profiles')
            .select(
                'id,email,role,is_blocked'
            )
            .eq('id', user.id)
            .maybeSingle();


        if (profileError) {

            console.error(
                'PROFILE ERROR:',
                profileError
            );

            return false;

        }


        if (!profile) {

            return false;

        }


        return (
            profile.role === 'admin' &&
            profile.is_blocked === false
        );

    }

    catch (error) {

        console.error(
            'CHECK ADMIN ERROR:',
            error
        );

        return false;

    }

}


/* =====================================================
   AUTO LOGIN
===================================================== */

(async () => {

    const isAdmin =
        await checkAdmin();


    if (isAdmin) {

        location.replace(
            'the-leader-admin-connected.html'
        );

    }

})();


/* =====================================================
   LOGIN
===================================================== */

$('form').onsubmit = async event => {

    event.preventDefault();

    hideMsg();


    const button =
        $('submit');


    button.disabled = true;

    button.classList.add(
        'loading'
    );

    button.textContent =
        'جاري التحقق...';


    const email =
        $('email')
            .value
            .trim()
            .toLowerCase();


    const password =
        $('password')
            .value;


    try {

        /*
         * التأكد من البيانات
         */

        if (!email || !password) {

            throw new Error(
                'missing'
            );

        }


        /*
         * تسجيل الدخول من Supabase Auth
         */

        const {
            data,
            error
        } = await sb.auth.signInWithPassword({

            email: email,

            password: password

        });


        if (error) {

            console.error(
                'SUPABASE LOGIN:',
                error
            );

            throw error;

        }


        if (
            !data ||
            !data.session ||
            !data.user
        ) {

            throw new Error(
                'no_session'
            );

        }


        /*
         * التأكد أن الحساب Admin
         */

        const isAdmin =
            await checkAdmin();


        if (!isAdmin) {

            await sb.auth.signOut({
                scope: 'local'
            });

            throw new Error(
                'not_admin'
            );

        }


        /*
         * دخول لوحة التحكم
         */

        location.replace(
            'the-leader-admin-connected.html'
        );

    }


    catch (error) {

        console.error(
            'ADMIN LOGIN ERROR:',
            error
        );


        if (
            error.message ===
            'not_admin'
        ) {

            showMsg(
                'الحساب ده مش حساب إدارة.'
            );

        }

        else if (
            error.message ===
            'missing'
        ) {

            showMsg(
                'اكتب البريد الإلكتروني وكلمة المرور.'
            );

        }

        else if (
            error.message ===
            'no_session'
        ) {

            showMsg(
                'تم تسجيل الدخول لكن لم يتم إنشاء جلسة.'
            );

        }

        else {

            /*
             * نخفي تفاصيل Supabase عن المستخدم
             * لكن نطبعها في Console للتشخيص.
             */

            showMsg(
                'البريد الإلكتروني أو كلمة المرور غير صحيحة.'
            );

        }

    }


    finally {

        button.disabled = false;

        button.classList.remove(
            'loading'
        );

        button.textContent =
            'دخول الإدارة';

    }

};

</script>

</body>
</html>
