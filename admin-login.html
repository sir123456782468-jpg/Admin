<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول الإدارة | The Leader In English</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e5e7eb;--brand:#ef4444}
[data-theme=dark]{--bg:#09111f;--card:#111b2e;--ink:#f8fafc;--muted:#94a3b8;--line:#24324a}
*{box-sizing:border-box;font-family:Cairo,sans-serif}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#fff,#f4f6fb);background-color:var(--bg);color:var(--ink);display:grid;place-items:center;padding:18px}[data-theme=dark] body{background:var(--bg)}
.card{width:min(460px,100%);background:var(--card);border:1px solid var(--line);border-radius:25px;padding:30px;box-shadow:0 20px 60px rgba(15,23,42,.12)}.logo{width:70px;height:70px;border-radius:20px;background:linear-gradient(135deg,#ef4444,#ec4899);color:#fff;display:grid;place-items:center;font-size:25px;font-weight:900;margin:auto}.title{text-align:center;margin:15px 0 4px;font-size:24px;font-weight:900}.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:13px;font-weight:800}.field input{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);outline:none}.btn{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#ef4444,#ec4899);color:#fff;font-weight:900;font-size:15px;cursor:pointer}.msg{display:none;margin-top:13px;padding:11px;border-radius:11px;background:rgba(239,68,68,.1);font-size:13px;font-weight:700}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:18px}.theme{position:fixed;top:15px;left:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 11px;border-radius:12px}
</style></head>
<body>
<button class="theme" id="theme">🌙</button>
<div class="card"><div class="logo">LE</div><h1 class="title">لوحة تحكم الإدارة</h1><p class="sub">The Leader In English · Mr Sherif Khafagy</p>
<form id="form"><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn" id="submit">دخول الإدارة</button><div class="msg" id="msg"></div></form><div class="foot">هذه الصفحة منفصلة عن واجهة الطلاب. الصلاحية تُتحقق من Supabase RLS.</div></div>
<script>
const SUPABASE_URL='https://cxtmvsoxgfsormhcklfx.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4dG12c294Z2Zzb3JtaGNrbGZ4IiwiaWF0IjoxNzkwMjcyODI0LCJleHAiOjIxMDU4NDg4MjB9.9zsPxYkMvHuRoe1R-XW8xOEUsE3IvoPP_r-iYXU_5s8';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const msg=(t)=>{$('msg').textContent=t;$('msg').style.display='block'},$=id=>document.getElementById(id);
$('theme').onclick=()=>{document.body.dataset.theme=document.body.dataset.theme==='dark'?'light':'dark';localStorage.setItem('admin_theme',document.body.dataset.theme)};
document.body.dataset.theme=localStorage.getItem('admin_theme')||'light';
(async()=>{const {data}=await sb.auth.getSession();if(data.session){const {data:a}=await sb.rpc('is_admin');if(a===true)location.replace('the-leader-admin-connected.html')}})();
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('submit').textContent='جاري التحقق...';try{const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim().toLowerCase(),password:$('password').value});if(error)throw error;const {data:a,error:ae}=await sb.rpc('is_admin');if(ae||a!==true){await sb.auth.signOut({scope:'local'});throw new Error('not_admin')}location.replace('the-leader-admin-connected.html')}catch(err){msg(err.message==='not_admin'?'الحساب ده مش حساب إدارة.':'البريد الإلكتروني أو كلمة المرور غير صحيحة.');$('submit').disabled=false;$('submit').textContent='دخول الإدارة'}};
</script></body></html>
