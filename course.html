<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الكورس | The Leader In English</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#152033;--muted:#68758a;--line:#e6ebf2;--brand:#ef4444;--brand2:#ec4899;--ok:#16a34a;--shadow:0 14px 40px rgba(15,23,42,.08)}*{box-sizing:border-box;font-family:Cairo,sans-serif}body{margin:0;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}.top{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 20px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:11px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-weight:900}.brand b{display:block}.brand small{color:var(--brand);font-weight:800}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0}.wrap{max-width:1450px;margin:auto;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px}.card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:20px;padding:18px}.hero h1{font-size:28px;margin:0 0 7px}.muted{color:var(--muted)}.layout-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.viewer{margin-top:16px;background:#0b1220;border-radius:18px;overflow:hidden;min-height:300px;display:grid;place-items:center}.viewer iframe{width:100%;height:520px;border:0}.viewer .placeholder{color:#fff;padding:50px;text-align:center}.resource{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:14px;margin-top:9px;background:#fff}.resource .ico{width:42px;height:42px;border-radius:12px;background:#f3f4f6;display:grid;place-items:center;font-size:20px}.resource b{display:block}.resource small{color:var(--muted)}.sections{display:grid;gap:12px;margin-top:16px}.section{border:1px solid var(--line);border-radius:16px;overflow:hidden}.section h3{margin:0;padding:14px;background:#fafbfc;font-size:15px}.lesson{display:flex;align-items:center;gap:10px;padding:13px 14px;border-top:1px solid var(--line);cursor:pointer}.lesson:hover{background:#fafafa}.lesson.active{background:rgba(239,68,68,.06)}.lesson .play{width:40px;height:40px;border-radius:12px;background:rgba(239,68,68,.1);display:grid;place-items:center}.lesson .grow{flex:1}.lesson small{color:var(--muted)}.check{color:var(--ok);font-weight:900}.side{position:sticky;top:94px;height:max-content}.side .teacher{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#111827,#374151);color:#fff;display:grid;place-items:center;font-weight:900}.notice{margin-top:14px;padding:12px;border-radius:13px;background:#fff7ed;color:#9a3412;font-size:13px}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:900px){.wrap{grid-template-columns:1fr}.side{position:static}.viewer iframe{height:330px}}@media(max-width:600px){.top{height:auto;min-height:74px}.wrap{padding:12px}.hero h1{font-size:22px}.viewer iframe{height:230px}}
</style></head><body>
<header class="top"><div class="brand"><div class="logo">LE</div><div><b id="platformName">The Leader In English</b><small id="teacherName">Mr Sherif Khafagy</small></div></div><button class="btn" onclick="location.href='home.html'">العودة للمنصة</button></header>
<div class="wrap"><main><section class="card hero"><div class="layout-title"><div><h1 id="courseTitle">جاري التحميل...</h1><p id="courseDesc" class="muted"></p></div><span id="accessBadge" class="btn">...</span></div><div id="viewer" class="viewer"><div class="placeholder">اختر فيديو أو ملف من القائمة</div></div><div id="resourceBox" class="card" style="display:none;margin-top:15px"></div></section><section id="sections" class="sections"></section></main>
<aside class="side"><div class="card"><div class="teacher"><div class="avatar" id="avatar">LE</div><div><b id="teacherSide">Mr Sherif Khafagy</b><small class="muted" style="display:block">The Leader In English</small></div></div><div class="notice">الفيديوهات يتم عرضها داخل المنصة، ورابط YouTube نفسه لا يظهر للطالب. ملفات Drive/PDF تُعرض داخل الصفحة.</div><div id="courseMeta" style="margin-top:14px"></div></div></aside></div>
<script>
const SUPABASE_URL='https://cxtmvsoxgfsormhcklfx.supabase.co';const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4dG12c294Z2Zzb3JtaGNrbGZ4IiwiaWF0IjoxNzkwMjcyODI0LCJleHAiOjIxMDU4NDg4MjB9.9zsPxYkMvHuRoe1R-XW8xOEUsE3IvoPP_r-iYXU_5s8';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const id=new URLSearchParams(location.search).get('id');let profile;
const esc=x=>String(x??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
function yt(url){let m=String(url||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);return m?`https://www.youtube.com/embed/${m[1]}?rel=0&modestbranding=1`:null}
function drive(url){let m=String(url||'').match(/drive\.google\.com\/file\/d\/([^/]+)/);return m?`https://drive.google.com/file/d/${m[1]}/preview`:String(url||'').includes('drive.google.com')?String(url).replace(/\/view.*$/,'/preview'):null}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session)return location.replace('signin.html');const p=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(p.error)return location.replace('signin.html');profile=p.data;if(profile.is_blocked)return location.replace('signin.html?blocked=1');const [settings,course]=await Promise.all([sb.from('platform_settings').select('*').eq('id',true).single(),sb.from('courses').select('*').eq('id',id).single()]);if(course.error)return document.getElementById('courseTitle').textContent='الكورس غير موجود';const c=course.data;if(settings.data){platformName.textContent=settings.data.platform_name;teacherName.textContent=settings.data.teacher_name;teacherSide.textContent=settings.data.teacher_name;avatar.textContent=(settings.data.teacher_name||'LE').replace(/^Mr\.?\s*/i,'').split(/\s+/).map(x=>x[0]).slice(0,2).join('')}courseTitle.textContent=c.title;courseDesc.textContent=c.description||'الدروس والمحتوى الخاص بالكورس';const enrolled=await sb.from('enrollments').select('id').eq('student_id',profile.id).eq('course_id',id).eq('is_active',true).maybeSingle();const access=!!enrolled.data||Number(c.price)===0;accessBadge.textContent=access?'متاح لك ✓':'غير مشترك';if(!access){sections.innerHTML='<div class="card empty">هذا الكورس يحتاج اشتراكاً. فعّل كود الاشتراك من الصفحة الرئيسية.</div>';return}const sec=await sb.from('course_sections').select('*').eq('course_id',id).order('sort_order');const lessons=await sb.from('lessons').select('*').eq('course_id',id).eq('is_published',true).order('sort_order');const resourcesRes=await sb.from('resources').select('*').in('lesson_id',(lessons.data||[]).map(x=>x.id));(lessons.data||[]).forEach(l=>l.lesson_resources=(resourcesRes.data||[]).filter(r=>r.lesson_id===l.id));const progress=await sb.from('lesson_progress').select('lesson_id,completed_at').eq('student_id',profile.id);const done=new Set((progress.data||[]).filter(x=>x.completed_at).map(x=>x.lesson_id));render(sec.data||[],lessons.data||[],done);courseMeta.innerHTML=`<b>${(lessons.data||[]).length}</b> درس<br><span class="muted">اختر الدرس لعرض محتواه</span>`}
function render(sectionsData,lessons,done){const groups=sectionsData.length?sectionsData.map(s=>[s,lessons.filter(l=>l.section_id===s.id)]):[['',lessons]];sections.innerHTML=groups.map(([s,ls])=>`<div class="section">${s?`<h3>${esc(s.title)}</h3>`:''}${ls.length?ls.map(l=>`<div class="lesson" data-id="${l.id}"><div class="play">▶</div><div class="grow"><b>${esc(l.title)}</b><small>${l.duration_seconds?Math.ceil(l.duration_seconds/60)+' دقيقة':'محتوى'}</small></div>${done.has(l.id)?'<span class="check">✓</span>':''}</div>`).join(''):'<div class="empty">لا توجد دروس في هذا القسم</div>'}</div>`).join('');document.querySelectorAll('.lesson').forEach(el=>el.onclick=()=>{document.querySelectorAll('.lesson').forEach(x=>x.classList.remove('active'));el.classList.add('active');showLesson(el.dataset.id,lessons)})}
function showLesson(id,lessons){const l=lessons.find(x=>x.id===id);if(!l)return;const resources=(l.lesson_resources||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));const first=resources[0];viewer.innerHTML='<div class="placeholder">اختر المحتوى من أسفل الدرس</div>';resourceBox.style.display='block';resourceBox.innerHTML=`<h3 style="margin-top:0">${esc(l.title)}</h3>${l.description?`<p class="muted">${esc(l.description)}</p>`:''}${resources.map(r=>`<div class="resource" data-r="${r.id}"><div class="ico">${r.resource_type==='youtube'?'▶️':r.resource_type==='pdf'||r.resource_type==='drive'?'📄':'🔗'}</div><div><b>${esc(r.title)}</b><small>${r.resource_type==='youtube'?'فيديو':r.resource_type==='pdf'?'PDF':'ملف / رابط'}</small></div></div>`).join('')||'<div class="empty">لا يوجد محتوى لهذا الدرس</div>'}`;resourceBox.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>openResource(resources.find(r=>r.id===x.dataset.r),l))}
function openResource(r,l){if(!r)return;const y=yt(r.url||r.embed_url);const d=drive(r.url||r.embed_url);if(r.resource_type==='youtube'||y){viewer.innerHTML=`<iframe src="${y||esc(r.embed_url)}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;picture-in-picture" allowfullscreen></iframe>`}else if(r.resource_type==='drive'||d){viewer.innerHTML=`<iframe src="${d||esc(r.embed_url)}" allow="autoplay" allowfullscreen></iframe>`}else if(r.resource_type==='pdf'){viewer.innerHTML=`<iframe src="${esc(r.embed_url||r.url)}" allowfullscreen></iframe>`}else{viewer.innerHTML=`<div class="placeholder"><a class="btn primary" target="_blank" rel="noopener" href="${esc(r.url||r.embed_url)}">فتح المحتوى</a></div>`}}
init();
</script></body></html>
